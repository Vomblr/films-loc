name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node 24 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run tests
        run: node --disable-warning=ExperimentalWarning --test tests/*.test.mjs
